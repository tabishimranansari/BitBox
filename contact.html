    <h1>Customer Registration and Order Form</h1>
    <form action="">
        <h3>CUstomer Information</h3>
        <table>

            <tr>
                <td><label for="fullname" class="required">Full Name:</label></td>
                <td> <input type="text" name="fullname" id="fullname" required></td>
            </tr>
            <tr>

                <td> <label for="email" class="required">Email:</label></td>
                <td><input type="email" name="email" id="email" required></td>
            </tr>

            <tr>

                <td><label for="password" class="required">Pasword:</label></td>
                <td><input type="password" name="password" id="password" required></td>
            </tr>

            <tr>

                <td><label for="phone" class="required">Phone Number:</label></td>
                <td><input type="tel" name="phone" id="phone" required></td>
            </tr>
        </table>

        <h3>Order Information</h3>
        <table>

            <tr>

                <td><label for="Quantity" class="required">Quantity</label></td>
                <td><input type="number" id="Quantity" name="Quantity" min="1" max="10" required></td>
            </tr>
            
            <tr>

                <td><label for="DeliveryDate" class="required">DeliveryDate</label></td>
                <td><input type="date" id="DeliveryDate" name="DeliveryDate"  required></td>
            </tr>

            <tr>
                <td><label for="food" class="required" >Select Food:</label></td>
                <td>
                    <select  name="food" id="food">
                        <option value="">--Please choose an option</option>
                        <option value="pizza">pizza</option>
                        <option value="burger">burger</option>
                        <option value="pasta">pasta</option>
                        <option value="desert">desert</option>
                        <option value="beverages">beverages</option>
                    </select>
                </td>
            </tr>
        </table>
    
        <table>
            <tr>
                <td><label for="payment" class="required" >Select payment method:</label></td>
                <td>
                    <!--cc -- creditcard-->
                    <input type="radio" id="creditcard" name="payment" value="cc" required>
                    <label for="creditcard">Credit Card</label><br>

                    <!--Debit card-->
                    <input type="radio" id="debitcard" name="payment" value="dc" required>
                    <label for="debitcard" >Debit Card</label><br>

                    <!--Cash-->
                    <input type="radio" id=" cash" name="payment" value="cash" required>
                    <label for="cash">Cash</label><br>
                </td>
            </tr>
        </table>

        <h3>Extras</h3>
        <table>
            <tr>
                <td><label for="extras">Select Extras:</label></td>
                <td>
                    <input type="checkbox" id="chesse" name="extra" value="chesse">
                    <label for="chesse">Extra Chesse</label><br>

                    <input type="checkbox" id="sauce" name="extra" value=" sauce">
                    <label for="sauce">Extra Sauce</label><br>

                    <input type="checkbox" id="toopings" name=" extra" value="toopings">
                    <label for="toopings">Extra Toopings</label><br>
                </td>
            </tr>
        </table>

        <h3>Delivery Instructions</h3>
        <table>
            <tr>
                <td><label for="delivery">delivery instructions:</label></td>
                <td><textarea name="delivery" id="delivery" rows="4" cols="50"></textarea></td>
            </tr>
            <tr>
                <td><input type="submit" value="submit order"></td>
                <td><input type="reset" value="reset form"></td>
            </tr>
        </table>
    </form>
